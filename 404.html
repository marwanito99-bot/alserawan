:root{--blue:#1d00f4;--lime:#ccfd1b;--black:#0a0a0f;--dark2:#131320;--text:#f0ede6;--muted:#7a7a9a;--border:rgba(29,0,244,.22)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:
    radial-gradient(900px 420px at 50% -10%,rgba(29,0,244,.16),transparent 70%),

  color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  text-align:center;padding:1.5rem;
}
.e{max-width:520px;width:100%}
.n{
  font-size:clamp(4.5rem,18vw,8rem);font-weight:800;line-height:.95;letter-spacing:-.04em;
  color:var(--blue);-webkit-text-stroke:1px var(--lime);margin-bottom:.4rem;
}
.tag{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--lime);margin-bottom:1.4rem}

p .ar{display:block;margin-top:.35rem;font-family:"IBM Plex Sans Arabic",system-ui,Arial,sans-serif;direction:rtl}
.row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
a.btn{
  background:var(--blue);color:#fff;padding:.8rem 1.9rem;text-decoration:none;
  font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  display:inline-block;border:1px solid transparent;transition:background .22s,color .22s,transform .22s;
}
a.btn:hover{background:var(--lime);color:var(--black);transform:translateY(-2px)}
a.btn.alt{background:transparent;border-color:var(--border);color:var(--muted)}
a.btn.alt:hover{background:transparent;border-color:var(--lime);color:var(--lime)}
a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media(prefers-reduced-motion:reduce){a.btn{transition:none}a.btn:hover{transform:none}}
